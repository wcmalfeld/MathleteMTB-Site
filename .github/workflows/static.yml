# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Member login: write js/supabase-config.js from the repository
      # variables SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and
      # variables -> Actions -> Variables). Only the public anon key belongs
      # here; the build fails if a service_role key is supplied by mistake.
      - name: Write Supabase browser config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const url = (process.env.SUPABASE_URL || "").trim().replace(/\/+$/, "").replace(/\/(rest|auth|storage)\/v1$/, "");
            const anonKey = (process.env.SUPABASE_ANON_KEY || "").trim();
            if (anonKey) {
              let role = "";
              try { role = JSON.parse(Buffer.from(anonKey.split(".")[1], "base64url").toString()).role; } catch (e) {}
              if (role && role !== "anon") { console.error("SUPABASE_ANON_KEY is a " + role + " key. Use the anon public key."); process.exit(1); }
              if (/^sb_secret_/.test(anonKey)) { console.error("SUPABASE_ANON_KEY is a secret key. Use the publishable/anon key."); process.exit(1); }
            }
            if (!url || !anonKey) console.log("::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set; member login will be disabled.");
            fs.writeFileSync("js/supabase-config.js", "window.MATHLETE_SUPABASE = " + JSON.stringify({ url, anonKey }) + ";\n");
          '
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

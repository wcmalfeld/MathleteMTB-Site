<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jump Lab — Mathlete MTB</title>
<meta name="description" content="Set the speed, angle and heights of a jump, predict where the rider lands, then send it and check the projectile-motion math.">
<link rel="canonical" href="https://www.mathletemtb.com/learning-lab/jump-lab/">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one wide "trail-side instrument" — big side-view canvas left,
   setup + mission cards right; math workbench under the canvas.
   Single dark theme by design (PRD §8: dark, trail-inspired). */
:root {
  color-scheme: dark;
  --night: #10130f;      /* page */
  --panel: #171b15;      /* cards */
  --panel-2: #1f241c;    /* raised */
  --line: #2e3529;
  --bone: #ece6d6;       /* text */
  --muted: #a0a795;
  --faint: #6d7464;
  --accent: #f0a23b;     /* trail-marker amber */
  --accent-ink: #1b1206;
  --dirt: #6e4728;
  --dirt-hi: #a8743f;
  --dirt-lo: #3d2716;
  --sky-top: #141a1e;
  --sky-bot: #1b2219;
  --good: #82cf84;
  --bad: #f0705c;
  --warn: #e8c64e;
  --vx: #72bbea;
  --vy: #ea92c6;
  --cmpA: #72bbea;
  --cmpB: #c6a2f2;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--night); color: var(--bone); }
body {
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1480px; margin: 0 auto 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand small { font: 600 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.brand h1 { margin: 0; font: 800 34px/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--bone); color: var(--night); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font: 800 19px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 10px 22px; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: none; }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--bone); color: var(--night); border-color: var(--bone); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; max-width: 1480px; margin: 0 auto; align-items: start; }
.main-col, .side { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 1040px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font: 800 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- stage ---------- */
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.canvas-wrap { position: relative; }
#scene { display: block; width: 100%; height: auto; touch-action: pan-y; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--night) 82%, transparent); padding: 16px; }
.overlay-card { max-width: 520px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; text-align: left; }
.overlay-card h3 { margin: 0 0 8px; font: 800 26px/1.1 var(--f-display); text-transform: uppercase; text-wrap: balance; }
.overlay-card p { margin: 0 0 14px; color: var(--muted); }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.transport .grow { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.transport label { font-size: 13px; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; background: none; color: var(--muted); min-height: 32px; }
.chip[aria-pressed="true"] { color: var(--bone); border-color: var(--muted); background: var(--panel-2); }
.chip[aria-pressed="true"]::before { content: "✓"; color: var(--accent); }
select { max-width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 40px; }

.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); border-top: 1px solid var(--line); }
.ro { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
.ro:last-child { border-right: 0; }
.ro .k { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.ro .v { font: 600 21px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ro .v small { font-size: 13px; color: var(--muted); margin-left: 3px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.success { color: var(--good); } .pill.undershoot, .pill.no-landing, .pill.invalid { color: var(--bad); } .pill.overshoot { color: var(--warn); } .pill.pending { color: var(--muted); }
.diff { font: 700 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.diff.beginner { color: var(--good); } .diff.intermediate { color: var(--vx); } .diff.advanced { color: var(--warn); } .diff.expert { color: var(--bad); }

/* ---------- controls ---------- */
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.ctl:first-of-type { border-top: 0; padding-top: 0; }
.ctl label { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.ctl label .sym { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.ctl .numwrap { display: flex; align-items: center; gap: 4px; }
.ctl input[type="number"] { width: 78px; text-align: right; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ctl input[type="number"]:disabled { opacity: .6; }
.ctl .unit { color: var(--muted); font-size: 13px; min-width: 32px; }
.ctl input[type="range"] { grid-column: 1 / -1; width: 100%; }
.ctl .err { grid-column: 1 / -1; color: var(--bad); font-size: 13px; }
.ctl.locked label::after { content: "Locked"; font: 700 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.lockico { width: 12px; height: 12px; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 32px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--line) var(--fill, 50%)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--line) var(--fill, 50%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: var(--bone); border: 3px solid var(--night); box-shadow: 0 0 0 1.5px var(--accent); }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--bone); border: 3px solid var(--night); box-shadow: 0 0 0 1.5px var(--accent); }
input[type="range"]:disabled { cursor: not-allowed; opacity: .4; }
input[type="range"].scrub::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--muted) var(--fill, 0%), var(--line) var(--fill, 0%)); }
input[type="range"].scrub::-moz-range-track { background: linear-gradient(to right, var(--muted) var(--fill, 0%), var(--line) var(--fill, 0%)); }

/* ---------- activity panel ---------- */
.mission h3 { margin: 6px 0 6px; font: 800 26px/1.05 var(--f-display); text-transform: uppercase; text-wrap: balance; }
.mission p { margin: 0 0 10px; }
.mission ul { margin: 0 0 12px; padding-left: 18px; }
.mission li { margin: 2px 0; }
.varchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.varchip { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); }
.varchip.adj { border-color: var(--accent); color: var(--accent); }
.varchip.fix { color: var(--muted); }
.block { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; display: grid; gap: 8px; }
.feedback { border-radius: 8px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.feedback.success { border-color: var(--good); }
.feedback.fail { border-color: var(--bad); }
.feedback.near { border-color: var(--warn); }
.feedback strong { display: block; font: 800 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
.hint { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; border: 1px dashed var(--line); }
.hint b { color: var(--accent); font-family: var(--f-mono); font-size: 12px; margin-right: 6px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.challenge-list { display: grid; gap: 8px; }
.cl-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; width: 100%; }
.cl-item:hover { border-color: var(--muted); }
.cl-item[aria-current="true"] { border-color: var(--accent); }
.cl-item .n { font: 800 22px/1 var(--f-display); color: var(--accent); width: 22px; }
.cl-item .t { font-weight: 700; }
.cl-item .s { font-size: 12px; color: var(--muted); }
.done { color: var(--good); font-weight: 700; font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 9px 12px; cursor: pointer; min-height: 40px; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); }
.opt.correct { border-color: var(--good); }
.opt.correct::after { content: "  ✓ actual result"; color: var(--good); font-weight: 700; font-size: 13px; }
.opt.wrong::after { content: "  ✕ your pick"; color: var(--bad); font-weight: 700; font-size: 13px; }
.opt:disabled { cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-in { display: flex; gap: 8px; align-items: center; }
.answer-in input { width: 110px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--f-mono); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
table.cmp th, table.cmp td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
table.cmp td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.swatch { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }

/* ---------- tutor ---------- */
.tutor { border-color: var(--accent); }
.tutor h2 .tag { font: 700 10px/1 var(--f-body); letter-spacing: .12em; background: var(--accent); color: var(--accent-ink); padding: 4px 6px; border-radius: 4px; }
.locks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.locks .btn { justify-content: flex-start; }
.tutor .sub { font-weight: 700; font-size: 13px; color: var(--muted); margin: 14px 0 6px; letter-spacing: .04em; }

/* ---------- workbench ---------- */
.wb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
.wb-head h2 { margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 14px 0 12px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--bone); border-bottom-color: var(--accent); }
.eqgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.eq { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.eq .name { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.eq .f { font: 600 18px/1.4 var(--f-mono); margin: 4px 0; overflow-x: auto; }
.eq .d { font-size: 14px; color: var(--muted); }
.defs { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin-top: 12px; }
.defs dt { font-family: var(--f-mono); color: var(--accent); }
.defs dd { margin: 0; }
.work { display: grid; gap: 10px; counter-reset: step; }
.work .stp { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.work .stp::before { counter-increment: step; content: counter(step); font: 800 20px/1.3 var(--f-display); color: var(--accent); }
.work .what { font-size: 14px; color: var(--muted); }
.work .math { font: 500 15px/1.6 var(--f-mono); overflow-x: auto; white-space: nowrap; }
.work .math b { color: var(--accent); font-weight: 600; }
.concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.concept { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; }
.concept h4 { margin: 0 0 4px; font: 700 16px/1.2 var(--f-body); }
.concept p { margin: 0; color: var(--muted); font-size: 14px; }
.concept[aria-expanded="false"] p { display: none; }
.hidden-note { color: var(--muted); font-style: italic; padding: 8px 0; }

/* ---------- dialog ---------- */
.modal { position: fixed; inset: 0; background: color-mix(in srgb, var(--night) 80%, transparent); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal .panel { width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 10px; }
.stat .v { font: 600 22px/1.2 var(--f-mono); }
.stat .k { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) {
  .brand h1 { font-size: 28px; }
  .topbar { gap: 8px; }
  .topbar .seg button { padding: 6px 10px; font-size: 13px; }
  .topbar .btn { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .transport .btn.primary { flex: 1 1 100%; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ro .v { font-size: 18px; }
  .locks { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- SVG scene ---------- */
#scene .sky-top { stop-color: var(--sky-top); } #scene .sky-bot { stop-color: var(--sky-bot); }
#scene .grid { stroke: var(--line); stroke-width: 1; }
#scene .axis { stroke: var(--faint); stroke-width: 1.5; }
#scene .tick { fill: var(--faint); font: 400 12px var(--f-mono); }
#scene .axlbl { fill: var(--muted); font: 600 13px var(--f-mono); }
#scene .dirt { fill: var(--dirt); }
#scene .gap { fill: var(--dirt-lo); }
#scene .edge { stroke: var(--dirt-hi); stroke-width: 3; fill: none; stroke-linejoin: round; }
#scene .zone { fill: var(--good); fill-opacity: .22; stroke: var(--good); stroke-width: 2; }
#scene .zlbl { fill: var(--good); font: 700 12px var(--f-body); letter-spacing: .12em; }
#scene .tgt { stroke: var(--good); stroke-width: 2; }
#scene .pred { stroke: var(--bone); stroke-width: 2; stroke-dasharray: 6 7; fill: none; opacity: .8; }
#scene .flown { stroke: var(--accent); stroke-width: 3.5; fill: none; stroke-linecap: round; }
#scene .ghost { stroke: var(--muted); stroke-width: 1.5; fill: none; opacity: .4; }
#scene .cmpA { stroke: var(--cmpA); stroke-width: 2.5; stroke-dasharray: 12 5; fill: none; }
#scene .cmpB { stroke: var(--cmpB); stroke-width: 2.5; stroke-dasharray: 3 5; fill: none; stroke-linecap: round; }
#scene .cmpAt { fill: var(--cmpA); } #scene .cmpBt { fill: var(--cmpB); }
#scene .dim { stroke: var(--muted); stroke-width: 1.2; fill: none; }
#scene .dimdash { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
#scene .lbl { fill: var(--bone); font: 600 13px var(--f-mono); paint-order: stroke; stroke: var(--night); stroke-width: 4px; stroke-linejoin: round; }
#scene .lbl.big { font-size: 15px; }
#scene .muted { fill: var(--muted); }
#scene .rider { stroke: var(--bone); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#scene .rider .head { fill: var(--bone); stroke: none; }
#scene .vec { stroke-width: 3; fill: none; }
#scene .vv { stroke: var(--accent); } #scene .vx { stroke: var(--vx); } #scene .vy { stroke: var(--vy); }
#scene .mv { fill: var(--accent); } #scene .mx { fill: var(--vx); } #scene .my { fill: var(--vy); }
#scene .tv { fill: var(--accent); } #scene .tx { fill: var(--vx); } #scene .ty { fill: var(--vy); }
#scene .ok { fill: var(--good); } #scene .bad { fill: var(--bad); } #scene .warn { fill: var(--warn); }
#scene .okS { stroke: var(--good); } #scene .badS { stroke: var(--bad); } #scene .warnS { stroke: var(--warn); }
#scene .annot { fill: var(--accent); font: 500 14px var(--f-mono); paint-order: stroke; stroke: var(--night); stroke-width: 4px; }
#scene .apexdot { fill: var(--bone); }
</style>
</head>
<body>


<header class="topbar">
  <div class="brand"><small>Mathlete MTB</small><h1>Jump <span>Lab</span></h1></div>
  <div class="seg" role="tablist" aria-label="Activity">
    <button role="tab" id="tabExplore" aria-selected="true">Explore</button>
    <button role="tab" id="tabChallenge" aria-selected="false">Challenges</button>
  </div>
  <div class="seg" aria-label="Units">
    <button id="uImp" aria-pressed="true">ft · mph</button>
    <button id="uMet" aria-pressed="false">m · km/h</button>
  </div>
  <button class="btn" id="tutorBtn" aria-pressed="false">Tutor mode</button>
  <button class="btn ghost" id="sessionBtn">Session</button>
</header>

<main class="layout">
  <div class="main-col">
    <section class="stage" aria-label="Jump simulation">
      <div class="canvas-wrap">
        <svg id="scene" role="img" aria-labelledby="sceneDesc" xmlns="http://www.w3.org/2000/svg"><desc id="sceneDesc">Side view of the jump</desc></svg>
        <div id="overlay" class="overlay" hidden></div>
      </div>
      <div class="transport">
        <button class="btn primary" id="sendBtn">Send it</button>
        <button class="btn" id="playBtn" aria-label="Play">▶ Play</button>
        <button class="btn" id="resetBtn">↺ Reset</button>
        <label for="rate">Speed</label>
        <select id="rate"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option><option value="0.1">0.1×</option></select>

'use strict';
const __units = (() => {

/**
 * Jump Lab — Unit system
 * Physics is always SI. These helpers convert at the UI boundary only.
 */

const MPH_TO_MS = 0.44704; // exact
const KMH_TO_MS = 1 / 3.6;
const FT_TO_M = 0.3048; // exact

const UNIT_SYSTEMS = Object.freeze({
  imperial: { speed: 'mph', length: 'ft', g: 'ft/s²', velocity: 'ft/s' },
  metric: { speed: 'km/h', length: 'm', g: 'm/s²', velocity: 'm/s' },
});

const mphToMs = (v) => v * MPH_TO_MS;
const msToMph = (v) => v / MPH_TO_MS;
const kmhToMs = (v) => v * KMH_TO_MS;
const msToKmh = (v) => v / KMH_TO_MS;
const ftToM = (d) => d * FT_TO_M;
const mToFt = (d) => d / FT_TO_M;

/** Display speed (mph or km/h) → m/s */
function speedToSI(v, system) {
  return system === 'metric' ? kmhToMs(v) : mphToMs(v);
}
function speedFromSI(v, system) {
  return system === 'metric' ? msToKmh(v) : msToMph(v);
}
/** Display length (ft or m) → m */
function lengthToSI(d, system) {
  return system === 'metric' ? d : ftToM(d);
}
function lengthFromSI(d, system) {
  return system === 'metric' ? d : mToFt(d);
}
/** Velocity (m/s) → ft/s or m/s — used in the workbench where equations need consistent units */
function velocityFromSI(v, system) {
  return system === 'metric' ? v : mToFt(v);
}
function gFromSI(g, system) {
  return system === 'metric' ? g : mToFt(g);
}

return { MPH_TO_MS, KMH_TO_MS, FT_TO_M, UNIT_SYSTEMS, mphToMs, msToMph, kmhToMs, msToKmh, ftToM, mToFt, speedToSI, speedFromSI, lengthToSI, lengthFromSI, velocityFromSI, gFromSI };
})();

const __physics = (() => {

/**
 * Jump Lab — Physics Engine
 * --------------------------------------------------------------
 * Pure, deterministic 2D projectile-motion model. No DOM, no state.
 * All functions take and return SI units (m, s, m/s, radians unless
 * a name ends in "Deg"). Unit conversion lives in units.js.
 *
 * Model assumptions (PRD §5.1): constant g, no drag, no lift,
 * rider is a point mass, no in-flight input.
 */

const G = 9.80665; // standard gravity, m/s²
const EPS = 1e-9;

const degToRad = (d) => (d * Math.PI) / 180;
const radToDeg = (r) => (r * 180) / Math.PI;

const isNum = (n) => typeof n === 'number' && Number.isFinite(n);

/**
 * Validate a jump configuration. Returns a list of human-readable
 * problems; empty list means the config is usable.
 */
function validateConfig(cfg) {
  const errors = [];
  const fields = ['v0', 'angleDeg', 'y0', 'yL'];
  for (const f of fields) if (!isNum(cfg[f])) errors.push(`${f} must be a finite number`);
  if (isNum(cfg.v0) && cfg.v0 < 0) errors.push('Speed cannot be negative');
  if (isNum(cfg.angleDeg) && (cfg.angleDeg <= -90 || cfg.angleDeg >= 90))
    errors.push('Launch angle must be between -90° and 90°');
  if (cfg.g !== undefined && (!isNum(cfg.g) || cfg.g <= 0)) errors.push('Gravity must be positive');
  return errors;
}

/** Velocity components at launch: vₓ = v₀cosθ, vᵧ = v₀sinθ */
function components(v0, angleDeg) {
  const th = degToRad(angleDeg);
  return { vx: v0 * Math.cos(th), vy: v0 * Math.sin(th) };
}

/** x(t), y(t) */
function positionAt(cfg, t) {
  const g = cfg.g ?? G;
  const { vx, vy } = components(cfg.v0, cfg.angleDeg);
  return { x: vx * t, y: cfg.y0 + vy * t - 0.5 * g * t * t };
}

/** vₓ(t) = v₀cosθ (constant), vᵧ(t) = v₀sinθ − gt */
function velocityAt(cfg, t) {
  const g = cfg.g ?? G;
  const { vx, vy } = components(cfg.v0, cfg.angleDeg);
  const vyt = vy - g * t;
  return { vx, vy: vyt, speed: Math.hypot(vx, vyt) };
}

/** Apex of the trajectory. If launched level/downward, apex is the lip. */
function apex(cfg) {
  const g = cfg.g ?? G;
  const { vx, vy } = components(cfg.v0, cfg.angleDeg);
  if (vy <= 0) return { t: 0, x: 0, y: cfg.y0 };
  const t = vy / g;
  return { t, x: vx * t, y: cfg.y0 + (vy * vy) / (2 * g) };
}

/**
 * Time when the rider reaches elevation yL on the DESCENDING part of
 * the path (PRD §5.3):
 *   t_L = [v₀sinθ + √((v₀sinθ)² + 2g(y₀ − y_L))] / g
 * Returns null when the trajectory never reaches yL while descending.
 */
function landingTime(cfg) {
  const g = cfg.g ?? G;
  const { vy } = components(cfg.v0, cfg.angleDeg);
  const disc = vy * vy + 2 * g * (cfg.y0 - cfg.yL);
  if (disc < -EPS) return null; // landing surface is above the apex
  const t = (vy + Math.sqrt(Math.max(0, disc))) / g;
  if (!(t > EPS)) return null; // only reached at/before launch
  // Must be descending (or at apex) when it gets there
  if (vy - g * t > EPS) return null;
  return t;
}

/** Landing time, position, velocity and impact angle, or null. */
function landing(cfg) {
  const t = landingTime(cfg);
  if (t === null) return null;
  const p = positionAt(cfg, t);
  const v = velocityAt(cfg, t);
  return {
    t,
    x: p.x,
    y: cfg.yL,
    vx: v.vx,
    vy: v.vy,
    speed: v.speed,
    impactAngleDeg: radToDeg(Math.atan2(-v.vy, v.vx)), // degrees below horizontal
  };
}

const RESULT = Object.freeze({
  UNDERSHOOT: 'undershoot',
  SUCCESS: 'success',
  OVERSHOOT: 'overshoot',
  NO_LANDING: 'no-landing',
  INVALID: 'invalid',
});

/**
 * Landing zone = [targetX − width/2, targetX + width/2].
 * The landing platform starts at the zone's near edge (the gap ends there).
 */
function zoneBounds(zone) {
  return { start: zone.targetX - zone.width / 2, end: zone.targetX + zone.width / 2 };
}

function classifyLanding(xL, zone) {
  if (xL === null || xL === undefined || !isNum(xL)) return RESULT.NO_LANDING;
  const { start, end } = zoneBounds(zone);
  if (xL < start - EPS) return RESULT.UNDERSHOOT;
  if (xL > end + EPS) return RESULT.OVERSHOOT;
  return RESULT.SUCCESS;
}

/**
 * Full simulation summary. Never throws — invalid input produces
 * { status: 'invalid', errors }.
 */
function simulate(cfg, zone) {
  const errors = validateConfig(cfg);
  if (errors.length) return { status: RESULT.INVALID, errors };
  const { vx, vy } = components(cfg.v0, cfg.angleDeg);
  const top = apex(cfg);
  const land = landing(cfg);
  let status = zone ? classifyLanding(land ? land.x : null, zone) : land ? null : RESULT.NO_LANDING;
  // The landing deck is a solid block starting at the zone's near edge. If the
  // rider is still below deck height when reaching that edge, they hit its face.
  const hitsFace = !!(zone && land && status !== RESULT.UNDERSHOOT && strikesFace(cfg, zone));
  if (hitsFace) status = RESULT.UNDERSHOOT;
  let miss = null;
  if (zone && land) {
    const { start, end } = zoneBounds(zone);
    miss = land.x < start ? land.x - start : land.x > end ? land.x - end : 0;
  }
  return { status, errors: [], vx, vy, apex: top, landing: land, miss, hitsFace, targetError: zone && land ? land.x - zone.targetX : null };
}

/** True if the rider is below the deck top (yL) when x reaches the deck edge. */
function strikesFace(cfg, zone) {
  const { start } = zoneBounds(zone);
  const { vx } = components(cfg.v0, cfg.angleDeg);
  if (!(start > 0) || !(vx > EPS)) return false;
  return positionAt(cfg, start / vx).y < cfg.yL - 1e-6;
}

/**
 * Sample the path for drawing. Stops at landing, or at tMax if the
 * rider never lands (so the renderer can still show the arc).
 */
function samplePath(cfg, n = 120, tMaxFallback = 3) {
  const land = landingTime(cfg);
  const tEnd = land ?? tMaxFallback;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = (tEnd * i) / n;
    const p = positionAt(cfg, t);
    pts.push({ t, x: p.x, y: p.y });
  }
  return { points: pts, tEnd, landed: land !== null };
}

/* ---------- Inverse solvers (used for worked solutions & checks) ---------- */

/**
 * Minimum launch speed so the path passes through (x, yL) at angle θ:
 *   yL = y₀ + x·tanθ − g·x² / (2v²cos²θ)
 *   ⇒ v = √( g·x² / (2cos²θ·(y₀ − yL + x·tanθ)) )
 * Returns null if no speed works (denominator ≤ 0).
 */
function speedForDistance(x, angleDeg, y0, yL, g = G) {
  const th = degToRad(angleDeg);
  const c = Math.cos(th);
  const denom = 2 * c * c * (y0 - yL + x * Math.tan(th));
  if (!(x > 0) || denom <= EPS) return null;
  return Math.sqrt((g * x * x) / denom);
}

/**
 * All launch angles (within [minDeg, maxDeg]) that land exactly at x.
 * Closed form via tan θ quadratic:
 *   (g x²/2v²)·T² − x·T + (g x²/2v² − (y₀ − yL)) = 0, T = tanθ
 */
function anglesForDistance(x, v0, y0, yL, g = G, minDeg = -89, maxDeg = 89) {
  if (!(x > 0) || !(v0 > 0)) return [];
  const k = (g * x * x) / (2 * v0 * v0);
  const a = k, b = -x, c = k - (y0 - yL);
  const disc = b * b - 4 * a * c;
  if (disc < 0) return [];
  const roots = [(-b - Math.sqrt(disc)) / (2 * a), (-b + Math.sqrt(disc)) / (2 * a)];
  const out = [];
  for (const T of roots) {
    const d = radToDeg(Math.atan(T));
    if (d >= minDeg - EPS && d <= maxDeg + EPS && landingTime({ v0, angleDeg: d, y0, yL, g }) !== null) {
      if (!out.some((o) => Math.abs(o - d) < 1e-6)) out.push(d);
    }
  }
  return out.sort((p, q) => p - q);
}

return { G, degToRad, radToDeg, validateConfig, components, positionAt, velocityAt, apex, landingTime, landing, RESULT, zoneBounds, classifyLanding, simulate, strikesFace, samplePath, speedForDistance, anglesForDistance };
})();

      out.push(`<text class="lbl big" x="${(v.X(0) + v.X(endX)) / 2}" y="${dimY - 7}" text-anchor="middle">${L && fl.kind === 'deck' ? 'x_L' : 'x'} = ${fmtL(endX)}</text>`);
      if (Math.abs(c.y0 - c.yL) > 1e-6) {
        const xx = v.X(g.deckStart) - 12;
        out.push(`<line class="dimdash" x1="${v.X(0)}" y1="${v.Y(c.y0)}" x2="${xx + 6}" y2="${v.Y(c.y0)}"/>`);
        out.push(`<line class="dim" x1="${xx}" y1="${v.Y(c.y0)}" x2="${xx}" y2="${v.Y(c.yL)}" marker-start="url(#dimA)" marker-end="url(#dimA)"/>`);
        const ly = c.yL < c.y0 ? v.Y(c.yL) - 8 : v.Y(c.yL) + 18;
        out.push(`<text class="lbl" x="${xx - 6}" y="${ly}" text-anchor="end">Δy = ${signed(c.yL - c.y0)}</text>`);
      }
    }
    const endP = P.positionAt(c, fl.tEnd);
    const st = sim.status;
    const cls = st === 'success' ? 'ok' : st === 'overshoot' ? 'warn' : 'bad';
    const icon = st === 'success' ? '✓' : st === 'overshoot' ? '→' : '✕';
    out.push(`<circle cx="${v.X(endP.x)}" cy="${v.Y(endP.y)}" r="7" class="${cls}"/>`);
    out.push(`<text class="lbl ${cls}" x="${v.X(endP.x)}" y="${v.Y(endP.y) + (fl.kind === 'deck' && !hiddenByMission() ? 42 : 24)}" text-anchor="middle">${icon} ${esc(statusShort(sim))}</text>`);
  }

  if (S.toggles.annot && pathVisible() && sim.status !== P.RESULT.INVALID) {
    const top = sim.apex;
    const mid = P.positionAt(c, fl.tEnd * 0.25);
    out.push(`<text class="annot" x="${v.X(mid.x) - 10}" y="${v.Y(mid.y) - 14}" text-anchor="end">y = y₀ + v₀sinθ·t − ½gt²</text>`);
    if (top.t > 0) out.push(`<text class="annot" x="${v.X(top.x) + 12}" y="${v.Y(top.y) + 22}">vᵧ = 0 here</text>`);
    out.push(`<text class="annot" x="${v.X(0) + 8}" y="${v.Y(c.y0) + 22}">(0, y₀)</text>`);
  }

  out.push('<g id="dyn"></g>');
  out.unshift(`<desc id="sceneDesc">${esc(sceneDescription(sim))}</desc>`);
  svg.innerHTML = out.join('');
  renderDynamic();
}

function statusShort(sim) {
  switch (sim.status) {
    case 'success': return 'In the zone';
    case 'overshoot': return 'Overshot';
    case 'undershoot': return sim.hitsFace ? 'Hit the deck face' : 'Short';
    case 'no-landing': return 'Never reaches deck';
    default: return 'Check inputs';
  }
}
function statusLong(sim) {
  const L = sim.landing;
  switch (sim.status) {
    case 'success': return `Lands ${fmtL(L.x)} out, inside the zone.`;
    case 'overshoot': return `Lands ${fmtL(L.x)} out, ${fmtL(sim.miss)} past the zone.`;
    case 'undershoot': return sim.hitsFace ? 'Still below deck height at the deck edge, so the rider hits the face of the landing.' : `Reaches deck height ${fmtL(L.x)} out, ${fmtL(-sim.miss)} before the deck starts.`;
    case 'no-landing': return `The deck is higher than the peak (${fmtL(sim.apex.y)}), so the path never comes down onto it.`;
    default: return 'Some inputs are not valid numbers.';
  }
}
function sceneDescription(sim) {
  if (!resultVisible()) return `Jump setup: ${fmtS(S.vars.speed)} at ${fmtA(S.vars.angle)}. Result hidden until the jump runs.`;
  return `Jump: ${fmtS(S.vars.speed)} at ${fmtA(S.vars.angle)}, takeoff ${fmtL(S.vars.takeoffElev)}, landing ${fmtL(S.vars.landingElev)}. ${statusLong(sim)}`;
}

/* rider + velocity vectors (redrawn every frame) */
function renderDynamic() {
  const v = VIEW;
  if (!v) return;
  const c = v.c, t = Math.min(S.anim.t, v.fl.tEnd);
  const host = $('#dyn');
  if (!host) return;
  const out = [];
  if (v.sim.status === P.RESULT.INVALID) { host.innerHTML = ''; return; }
  if (t > 0) out.push(`<polyline class="flown" points="${pts(v, pathPts(c, t, Math.max(4, Math.round(60 * t / Math.max(v.fl.tEnd, 1e-3)))))}"/>`);
  const p = P.positionAt(c, t), vel = P.velocityAt(c, t);
  const deg = (Math.atan2(vel.vy, vel.vx) * 180) / Math.PI;
  const rp = Math.max(6, ft(1.15) * v.s), wb = rp * 3.6;
  const X = v.X(p.x), Y = v.Y(p.y);
  out.push(`<g class="rider" transform="translate(${X.toFixed(1)} ${Y.toFixed(1)}) rotate(${(-deg).toFixed(2)})">
    <circle cx="${-wb / 2}" cy="${-rp}" r="${rp}"/><circle cx="${wb / 2}" cy="${-rp}" r="${rp}"/>
    <polyline points="${-wb / 2},${-rp} ${-wb * 0.05},${-rp * 0.9} ${wb * 0.32},${-rp * 2.2} ${wb / 2},${-rp}"/>
    <polyline points="${-wb / 2},${-rp} ${-wb * 0.12},${-rp * 2.2} ${-wb * 0.05},${-rp * 0.9}"/>
    <polyline points="${-wb * 0.05},${-rp * 0.9} ${wb * 0.02},${-rp * 2.5} ${wb * 0.22},${-rp * 3.4} ${wb * 0.34},${-rp * 2.35}"/>
    <circle class="head" cx="${wb * 0.27}" cy="${-rp * 4}" r="${rp * 0.5}"/>
  </g>`);
  if (S.toggles.vectors) {
    const k = v.s * 0.13; // px per (m/s)
    const ox = X, oy = Y - rp * 1.2;
    const ex = ox + vel.vx * k, ey = oy - vel.vy * k;
    out.push(`<line class="vec vx" x1="${ox}" y1="${oy}" x2="${ex}" y2="${oy}" marker-end="url(#arx)"/>`);
    if (Math.abs(vel.vy) > 0.05) out.push(`<line class="vec vy" x1="${ex}" y1="${oy}" x2="${ex}" y2="${ey}" marker-end="url(#ary)"/>`);
    out.push(`<line class="vec vv" x1="${ox}" y1="${oy}" x2="${ex}" y2="${ey}" marker-end="url(#arv)"/>`);
    out.push(`<text class="lbl tx" x="${(ox + ex) / 2}" y="${oy + 18}" text-anchor="middle">vₓ ${fmtV(vel.vx, 1)}</text>`);
    out.push(`<text class="lbl ty" x="${ex + 8}" y="${(oy + ey) / 2 + 4}">vᵧ ${fmtV(vel.vy, 1)}</text>`);
  }
  host.innerHTML = out.join('');
  $('#tLabel').textContent = `t = ${t.toFixed(2)} s`;
  const sc = $('#scrub');
  const frac = v.fl.tEnd > 0 ? t / v.fl.tEnd : 0;
  if (document.activeElement !== sc) sc.value = Math.round(frac * 1000);
  sc.style.setProperty('--fill', `${frac * 100}%`);
}

/* ============================ animation ============================ */
let raf = 0, lastTs = 0;
function frame(ts) {
  if (!S.anim.playing) return;
  const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000);
  lastTs = ts;
  S.anim.t += dt * S.anim.rate;
  if (S.anim.t >= S.anim.endT) {
    S.anim.t = S.anim.endT;
    S.anim.playing = false;
    renderDynamic();
    updatePlayBtn();
    onLanded();
    return;
  }
  renderDynamic();
  raf = requestAnimationFrame(frame);
}
function play() {
  if (S.anim.playing) return;
  if (S.anim.t >= S.anim.endT) S.anim.t = 0;
  S.anim.playing = true;
  lastTs = 0;
  updatePlayBtn();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches && S.anim.rate >= 1) { S.anim.t = S.anim.endT; frame(performance.now()); return; }
  raf = requestAnimationFrame(frame);
}
function stopAnim() { S.anim.playing = false; cancelAnimationFrame(raf); updatePlayBtn(); }
function updatePlayBtn() {
  const b = $('#playBtn');
  b.textContent = S.anim.playing ? '❚❚ Pause' : '▶ Play';
  b.setAttribute('aria-label', S.anim.playing ? 'Pause' : 'Play');
}

function sendIt() {
  const c = currentChallenge();
  if (c && !canSend(c)) return;
  stopAnim();
  S.anim.t = 0;
  S.anim.counted = false;
  play();
}
function onLanded() {
  const wasNew = !S.anim.counted;
  S.anim.counted = true;
  S.flownKey = key();
  if (S.blind) S.revealed = true;
  if (wasNew) {
    S.session.jumps++;
    const c = currentChallenge();
    if (c) registerAttempt(c);
  }
  renderScene();
  renderReadouts();
  renderActivity();
  if (S.wbTab === 'sub') renderWorkbench();
  announce(sceneDescription(VIEW.sim));
}

/* ============================ readouts ============================ */
function renderReadouts() {
  const sim = VIEW.sim, show = resultVisible() && !hiddenByMission() && sim.status !== 'invalid';
  const L = sim.landing;
  const cell = (k, v) => `<div class="ro"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const dash = '<span style="color:var(--faint)">—</span>';
  const split = (s) => { const i = s.lastIndexOf(' '); return `${s.slice(0, i)}<small>${s.slice(i + 1)}</small>`; };
  const st = sim.status;
  const pill = show ? `<span class="pill ${st}">${st === 'success' ? '✓' : st === 'overshoot' ? '→' : '✕'} ${statusShort(sim)}</span>` : `<span class="pill pending">${S.mode === 'challenge' ? 'Send it to test' : 'Hidden'}</span>`;
  $('#readouts').innerHTML = [
    cell('Airtime', show && L ? split(fmtT(L.t)) : dash),
    cell('Distance x<sub>L</sub>', show && L ? split(fmtL(L.x)) : dash),
    cell('Max height', show ? split(fmtL(sim.apex.y)) : dash),
    cell('Landing speed', show && L ? split(fmtS(L.speed)) : dash),
    cell('Result', pill),
  ].join('');
}

/* ========================= challenge engine ========================= */
function successText(c) {
  const zs = P.zoneBounds({ targetX: ft(c.zone.targetX), width: ft(c.zone.width) });
  const zr = `${fmtL(zs.start)} – ${fmtL(zs.end)}`;
  switch (c.type) {
    case 'min-speed': return `Land in the zone (${zr}) no more than ${fmtL(ft(c.success.maxPastStart))} past the deck edge.`;
    case 'two-jumps': return `Land in the zone (${zr}) twice, with launch angles at least ${c.success.minAngleDiff}° apart.`;
    case 'calculate': return `Your calculated distance must be within ${fmtL(ft(c.success.tolerance))} of the real landing.`;
    default: return `Land in the zone: ${zr}.`;
  }
}
function canSend(c) {
  const st = chState(c.id);
  if (c.prediction && st.predicted === null) return false;
  if (c.type === 'calculate' && st.answer === null) return false;
  return true;
}
function loadChallenge(id) {
  S.challengeId = id;
  S.mode = 'challenge';
  S.showList = false;
  S.tutorLocks = {};
  S.ghosts = [];
  S.flownKey = null;
  const c = currentChallenge();
  const base = { ...EXPLORE_DEFAULTS, targetX: c.zone.targetX, zoneWidth: c.zone.width, ...c.initial, ...c.fixed };
  for (const k in base) S.vars[k] = impToSI(VAR[k].kind, base[k]);
  S.toggles.path = false;
  const st = chState(id);
  if (!st.started) { st.started = true; S.session.started.add(id); c.concepts.forEach((x) => S.session.concepts.add(x)); }
  refreshAll();
}
function registerAttempt(c) {
  const st = chState(c.id);
  const sim = VIEW.sim;
  st.attempts++;
  S.session.attempts++;
  S.ghosts = [...S.ghosts, pathPts(VIEW.c, VIEW.fl.tEnd, 50)].slice(-4);
  const L = sim.landing;
  const zs = P.zoneBounds(zone());
  let ok = sim.status === 'success', title, body, tone;
  const air = L ? ` Airtime ${fmtT(L.t)}, peak ${fmtL(sim.apex.y)}.` : '';
  if (c.type === 'calculate') {
    const err = L ? Math.abs(st.answer - L.x) : Infinity;
    ok = err <= ft(c.success.tolerance);
    title = ok ? 'Called it' : 'Not quite';
    body = `You predicted ${fmtL(st.answer)}. The rider landed at ${L ? fmtL(L.x) : 'no valid landing'}, off by ${Number.isFinite(err) ? fmtL(err) : '—'}.` + (ok ? ' Your math matches the simulation.' : ' Open the worked solution to find where the numbers split.');
    tone = ok ? 'success' : 'fail';
  } else if (!ok) {
    tone = sim.status === 'overshoot' ? 'near' : 'fail';
    if (sim.status === 'undershoot') {
      title = sim.hitsFace ? 'Hit the face' : `Short by ${fmtL(-sim.miss)}`;
      body = (sim.hitsFace ? 'You were still below deck height when you reached the edge.' : `You reached deck height at ${fmtL(L.x)}; the deck starts at ${fmtL(zs.start)}.`) + ' You need more distance: more airtime, more forward speed, or both.';
    } else if (sim.status === 'overshoot') {
      title = `Long by ${fmtL(sim.miss)}`;
      body = `You landed at ${fmtL(L.x)}, past the end of the zone at ${fmtL(zs.end)}. Take a little off.`;
    } else { title = 'No landing'; body = statusLong(sim); }
  } else if (c.type === 'min-speed') {
    const past = L.x - zs.start;
    const vmin = P.speedForDistance(zs.start, S.vars.angle, S.vars.takeoffElev, S.vars.landingElev);
    if (past > ft(c.success.maxPastStart)) {
      ok = false; tone = 'near'; title = 'Cleared it, with speed to spare';
      body = `You landed ${fmtL(past)} past the edge. That means you're carrying more speed than you need. Back it off and find the minimum.`;
    } else {
      title = 'Minimum speed found';
      body = `${fmtS(S.vars.speed)} lands ${fmtL(past)} past the edge. The exact minimum from the formula is ${fmtS(vmin)}. Any slower and you land in the gap.` + air;
      tone = 'success';
    }
  } else if (c.type === 'two-jumps') {
    st.jumps.push({ angle: S.vars.angle, speed: S.vars.speed, t: L.t, h: sim.apex.y, x: L.x });
    const pair = findPair(st.jumps, c.success.minAngleDiff);
    if (pair) {
      title = 'Two different jumps, same landing';
      const [a, b] = pair;
      body = `${fmtA(a.angle)} at ${fmtS(a.speed)} vs ${fmtA(b.angle)} at ${fmtS(b.speed)}. The steeper jump flew ${fmtT(Math.max(a.t, b.t))} vs ${fmtT(Math.min(a.t, b.t))} and peaked ${fmtL(Math.abs(a.h - b.h))} higher.`;
      tone = 'success';
    } else {
      ok = false; tone = 'near'; title = `Jump ${st.jumps.length} logged`;
      body = `Landed at ${fmtL(L.x)} with a ${fmtA(S.vars.angle)} lip. Now land another one with an angle at least ${c.success.minAngleDiff}° different.`;
    }
  } else {
    title = 'Stuck it';
    body = `Landed ${fmtL(L.x)} out, ${fmtL(Math.abs(sim.targetError))} from the center of the zone.` + air;
    tone = 'success';
  }
  trackMission(c, st, ok, sim, title);
  st.last = { title, body, tone };
  if (ok && !st.solved) { st.solved = true; S.session.completed.add(c.id); }
}
/* ========================= progress tracking =========================
   Sends mission attempts and predictions to js/progress.js. It returns at
   once, never throws, and saves nothing unless a student is signed in.
   One visit to the lab is one play session. Each kind is registered in
   supabase/progress.sql:
     <mission id>        one attempt per "Send it" on a mission
     mission-prediction  the multiple-choice question before a mission
     predict-<id>        the "Predict, then test" questions in Explore */
const MP = window.MathleteProgress;
let trackSid = null;
const trackSession = () => trackSid || (trackSid = MP.startSession());
function trackMission(c, st, ok, sim, title) {
  if (!MP) return;
  // The first of the two landings in a two-jump mission is progress, not a miss.
  if (c.type === 'two-jumps' && !ok && sim.status === 'success') return;
  const L = sim.landing;
  const setup = c.type === 'calculate' ? `Predicted ${fmtL(st.answer)}` : `${fmtS(S.vars.speed)} at ${fmtA(S.vars.angle)}`;
  MP.recordQuestionAttempt({ gameId: 'jump-lab', questionId: 'jump-lab:' + c.id, questionKey: c.id,
    questionSnapshot: { prompt: c.description, title: c.title, objectives: c.objectives, goal: successText(c), type: c.type, level: c.difficulty,
      steps: c.solution, explanation: c.explanation },
    studentAnswer: `${setup}: ${title}`,
    correctAnswer: c.type === 'calculate' && L ? fmtL(L.x) : successText(c),
    isCorrect: ok,
    hintsUsed: st.hints + (st.solution ? 1 : 0),          // hints opened, plus the worked solution
    gameSessionId: trackSession() });
}
function trackChoice(kind, key, snap, options, choice, correct) {
  if (!MP || correct < 0 || choice == null) return;
  MP.recordQuestionAttempt({ gameId: 'jump-lab', questionId: 'jump-lab:' + kind, questionKey: key || undefined,
    questionSnapshot: { ...snap, type: 'choice', choices: options, answer: options[correct] },
    studentAnswer: options[choice], correctAnswer: options[correct], isCorrect: choice === correct,
    gameSessionId: trackSession() });
}

function findPair(jumps, minDiff) {
  for (let i = 0; i < jumps.length; i++) for (let j = i + 1; j < jumps.length; j++) if (Math.abs(jumps[i].angle - jumps[j].angle) >= minDiff - 1e-9) return [jumps[i], jumps[j]];
  return null;
}

/* ========================= activity panel ========================= */
function renderActivity() {
  const host = $('#activityPanel');
  if (S.mode === 'explore') host.innerHTML = exploreHTML();
  else host.innerHTML = S.showList ? listHTML() : missionHTML(currentChallenge());
  if (S.mode === 'explore') renderLiveFeedback();
  const send = $('#sendBtn');
  const c = currentChallenge();
  send.disabled = !!(c && !S.showList && !canSend(c));
  send.title = send.disabled ? (c.type === 'calculate' && chState(c.id).answer === null ? 'Lock in your answer first' : 'Make a prediction first') : '';
}

function exploreHTML() {
  const p = S.predict;
  let pred = `<div class="row"><select id="predSel" aria-label="Prediction question" style="width:100%">${PREDICTIONS.map((q, i) => `<option value="${i}">${esc(q.prompt)}</option>`).join('')}</select><button class="btn" id="predStart">Make a prediction</button></div>`;
  if (p) {
    const q = PREDICTIONS[p.q];
    const opts = q.options.map((o, i) => {
      let cls = '';
      if (p.done) { if (i === p.correct) cls = 'correct'; else if (i === p.choice) cls = 'wrong'; }
      return `<button class="opt ${cls}" data-pick="${i}" aria-pressed="${p.choice === i}" ${p.done ? 'disabled' : ''}>${esc(o.label)}</button>`;
    }).join('');
    const label = { distance: 'Distance', height: 'Height gained above the lip', time: 'Airtime' }[q.measure];
    const fmtM = (x) => (q.measure === 'time' ? fmtT(x) : fmtL(x));
    pred = `<p><strong>${esc(q.prompt)}</strong></p><div class="opts">${opts}</div>
      ${p.done ? `<div class="feedback ${p.choice === p.correct ? 'success' : 'fail'}"><strong>${p.choice === p.correct ? 'Your prediction held up' : 'Surprise'}</strong>
        ${label}: ${p.before == null ? '—' : fmtM(p.before)} → ${p.after == null ? '—' : fmtM(p.after)} (${p.ratio ? ((p.ratio - 1) * 100 >= 0 ? '+' : '') + ((p.ratio - 1) * 100).toFixed(0) + '%' : 'n/a'}).<br>${esc(q.why)}</div>
        <div class="row"><button class="btn small" id="predUndo">Undo the change</button><button class="btn small ghost" id="predClose">Done</button></div>`
      : `<div class="row"><button class="btn primary" id="predReveal" ${p.choice == null ? 'disabled' : ''}>Reveal</button><button class="btn small ghost" id="predClose">Cancel</button></div>`}`;
  }
  return `<h2>Explore</h2>
    <p style="margin:0 0 12px;color:var(--muted)">Move any slider and the arc updates live. Hit <b>Send it</b> to ride it, or scrub time to step through the flight.</p>
    <div id="liveFb"></div>
    <div class="block"><div class="eyebrow">Predict, then test</div>${pred}</div>
    <div class="block"><div class="eyebrow">Compare two jumps</div>
      <div class="row"><button class="btn small" id="saveA"><span class="swatch" style="background:var(--cmpA)"></span>Save as A</button><button class="btn small" id="saveB"><span class="swatch" style="background:var(--cmpB)"></span>Save as B</button>${S.compare.A || S.compare.B ? '<button class="btn small ghost" id="clearCmp">Clear</button>' : ''}</div>
      ${compareTable()}</div>
    <div class="block"><button class="btn" data-goto="challenge">Try the missions →</button></div>`;
}
function renderLiveFeedback() {
  const el = $('#liveFb');
  if (!el) return;
  const sim = VIEW.sim;
  if (!resultVisible()) { el.innerHTML = `<div class="feedback"><strong>Result hidden</strong>Make your call, then send it.</div>`; return; }
  const tone = sim.status === 'success' ? 'success' : sim.status === 'overshoot' ? 'near' : 'fail';
  el.innerHTML = `<div class="feedback ${tone}"><strong>${esc(statusShort(sim))}</strong>${esc(statusLong(sim))}${sim.landing ? ` Airtime ${fmtT(sim.landing.t)}.` : ''}</div>`;
}
function snapshot() {
  const c = cfg(), z = zone(), sim = P.simulate(c, z), g = geometry(c, z), fl = flight(c, z, sim, g);
  const path = pathPts(c, fl.tEnd, 60);
  return { vars: { ...S.vars }, sim, path, endX: path.at(-1).x };
}
function compareTable() {
  const A = S.compare.A, B = S.compare.B;
  if (!A && !B) return '<p style="margin:8px 0 0;color:var(--muted);font-size:14px">Save the current jump as A, change something, save it as B. Both arcs stay on the canvas.</p>';
  const row = (name, f, diff) => `<tr><td>${name}</td><td>${A ? f(A) : '—'}</td><td>${B ? f(B) : '—'}</td>${diff ? `<td>${A && B ? diff(A, B) : '—'}</td>` : '<td></td>'}</tr>`;
  const L = (j) => j.sim.landing;
  const pctd = (a, b) => (a && b ? `${((b / a - 1) * 100 >= 0 ? '+' : '')}${((b / a - 1) * 100).toFixed(0)}%` : '—');
  return `<div style="overflow-x:auto;margin-top:10px"><table class="cmp"><thead><tr><th></th><th><span class="swatch" style="background:var(--cmpA)"></span>A</th><th><span class="swatch" style="background:var(--cmpB)"></span>B</th><th>B vs A</th></tr></thead><tbody>
    ${row('Speed', (j) => fmtS(j.vars.speed), (a, b) => pctd(a.vars.speed, b.vars.speed))}
    ${row('Angle', (j) => fmtA(j.vars.angle))}
    ${row('Flight time', (j) => (L(j) ? fmtT(L(j).t) : '—'), (a, b) => pctd(L(a)?.t, L(b)?.t))}
    ${row('Distance', (j) => (L(j) ? fmtL(L(j).x) : '—'), (a, b) => pctd(L(a)?.x, L(b)?.x))}
    ${row('Max height', (j) => fmtL(j.sim.apex.y))}
    ${row('Lands at', (j) => (L(j) ? `(${fmtL(L(j).x)}, ${fmtL(L(j).y)})` : 'none'))}
    ${row('Result', (j) => statusShort(j.sim))}
  </tbody></table></div>`;

/* ============================ predictions ============================ */
function measureOf(sim, q, c) {
  if (q.measure === 'distance') return sim.landing?.x ?? null;
  if (q.measure === 'time') return sim.landing?.t ?? null;
  if (q.measure === 'height') return sim.apex.y - c.y0;
  return null;
}
function revealPrediction() {
  const p = S.predict, q = PREDICTIONS[p.q];
  const before = measureOf(P.simulate(cfg(), zone()), q, cfg());
  p.undo = { ...S.vars };
  const imp = { speed: U.msToMph(S.vars.speed), angle: S.vars.angle, landingElev: U.mToFt(S.vars.landingElev) };
  const next = q.apply(imp);
  if (next.speed !== imp.speed) S.vars.speed = Math.min(U.mphToMs(next.speed), U.mphToMs(70));
  if (next.angle !== imp.angle) S.vars.angle = next.angle;
  if (next.landingElev !== imp.landingElev) S.vars.landingElev = ft(next.landingElev);
  const after = measureOf(P.simulate(cfg(), zone()), q, cfg());
  const ratio = before && after != null ? after / before : null;
  p.before = before; p.after = after; p.ratio = ratio;
  p.correct = ratio == null ? -1 : q.options.findIndex((o) => o.test(ratio));
  p.done = true;
  trackChoice('predict-' + q.id, null, { prompt: q.prompt, explanation: q.why, note: q.note,
    setup: `${imp.speed.toFixed(1)} mph at ${fmtA(imp.angle)}, takeoff ${U.mToFt(p.undo.takeoffElev).toFixed(1)} ft, landing ${imp.landingElev.toFixed(1)} ft` },
    q.options.map((o) => o.label), p.choice, p.correct);
  S.session.predictions++;
  if (p.choice === p.correct) S.session.correct++;
  syncControls();
  onSetupChanged();
  renderActivity();
  sendIt();
}

const EQ = [
  { name: 'Horizontal position', f: 'x(t) = v₀ cos(θ) · t', s: 'Forward distance = forward speed × time.', a: 'No horizontal force, so aₓ = 0 and x grows linearly with t.' },
  { name: 'Vertical position', f: 'y(t) = y₀ + v₀ sin(θ) · t − ½ g t²', s: 'Start at the lip height, climb with your upward speed, and gravity pulls you back down.', a: 'Quadratic in t. The −½gt² term makes y(t) a downward-opening parabola.' },
  { name: 'Horizontal velocity', f: 'vₓ = v₀ cos(θ)', s: 'Your forward speed never changes in the air.', a: 'The cosine component of the launch vector. Constant because aₓ = 0.' },
  { name: 'Vertical velocity', f: 'vᵧ = v₀ sin(θ) − g t', s: 'Upward speed drops by g every second, hits zero at the peak, then you fall.', a: 'Linear in t with slope −g. vᵧ = 0 at t_peak = v₀ sin(θ) / g.' },
  { name: 'Landing time', f: 't_L = [v₀ sinθ + √((v₀ sinθ)² + 2g(y₀ − y_L))] / g', s: 'When do you touch down? Set y(t) equal to the landing height and solve.', a: 'Quadratic formula on ½gt² − (v₀ sinθ)t − (y₀ − y_L) = 0, keeping the + root (the way down). Negative discriminant ⇒ no real landing.' },
  { name: 'Landing distance', f: 'x_L = v₀ cos(θ) · t_L', s: 'Plug the landing time into the forward-distance equation.', a: 'Composition: x_L = x(t_L). Range on flat ground reduces to v₀² sin(2θ) / g.' },
  { name: 'Peak height', f: 'y_max = y₀ + (v₀ sinθ)² / 2g', s: 'How high above the datum you get at the top of the arc.', a: 'From vᵧ² = (v₀ sinθ)² − 2g(y − y₀) with vᵧ = 0.' },
  { name: 'Path shape y(x)', f: 'y = y₀ + x tanθ − g x² / (2 v₀² cos²θ)', s: 'Eliminate time and the path itself is a parabola in x.', a: 'Substitute t = x / (v₀ cosθ) into y(t). This is the curve drawn on the canvas.', adv: true },
];
const DEFS = [['v₀', 'takeoff speed (along the lip)'], ['θ', 'launch angle above horizontal'], ['g', 'gravity, 32.17 ft/s² or 9.81 m/s²'], ['t', 'time since leaving the lip'], ['y₀', 'lip height above the datum (y = 0)'], ['y_L', 'landing deck height'], ['x_L', 'horizontal distance to touchdown'], ['vₓ, vᵧ', 'horizontal and vertical parts of velocity']];

function substitutionHTML() {
  const c = currentChallenge();
  if (c && c.type === 'calculate' && chState(c.id).answer === null) return '<p class="hidden-note">Locked during this mission. Work it out by hand, lock in your answer, then this tab shows the full calculation.</p>';
  if (S.blind && !S.revealed) return '<p class="hidden-note">Hidden until the tutor reveals the jump.</p>';
  const m = met();
  const gU = m ? 9.81 : 32.17, vu = U.UNIT_SYSTEMS[S.units].velocity, lu = unitOf('length');
  const g = U.gFromSI(P.G, S.units);
  const v0d = U.speedFromSI(S.vars.speed, S.units), v0 = U.velocityFromSI(S.vars.speed, S.units);
  const th = S.vars.angle, rad = P.degToRad(th);
  const y0 = U.lengthFromSI(S.vars.takeoffElev, S.units), yL = U.lengthFromSI(S.vars.landingElev, S.units);
  const vx = v0 * Math.cos(rad), vy = v0 * Math.sin(rad);
  const f = (x, d = 2) => (+x).toFixed(d);
  const disc = vy * vy + 2 * g * (y0 - yL);
  const steps = [];
  steps.push(['Convert speed to ' + vu, m ? `v₀ = ${f(v0d, 1)} km/h ÷ 3.6 = <b>${f(v0)} ${vu}</b>` : `v₀ = ${f(v0d, 1)} mph × 5280 / 3600 = <b>${f(v0)} ${vu}</b>`]);
  steps.push(['Split the velocity', `vₓ = ${f(v0)} · cos ${f(th, 1)}° = ${f(v0)} × ${f(Math.cos(rad), 4)} = <b>${f(vx)} ${vu}</b><br>vᵧ = ${f(v0)} · sin ${f(th, 1)}° = ${f(v0)} × ${f(Math.sin(rad), 4)} = <b>${f(vy)} ${vu}</b>`]);
  steps.push(['Peak of the arc', `t_peak = vᵧ / g = ${f(vy)} / ${f(gU)} = <b>${f(vy / g, 3)} s</b><br>y_max = ${f(y0)} + ${f(vy)}² / (2 × ${f(gU)}) = <b>${f(y0 + (vy * vy) / (2 * g))} ${lu}</b>`]);
  if (disc < 0) {
    steps.push(['Landing time', `vᵧ² + 2g(y₀ − y_L) = ${f(vy * vy)} + 2 × ${f(gU)} × (${f(y0)} − ${f(yL)}) = <b>${f(disc)}</b><br>Square root of a negative number has no real answer. The deck is above your peak, so there is no landing.`]);
  } else {
    const tL = (vy + Math.sqrt(disc)) / g;
    steps.push(['Landing time (quadratic, + root)', `t_L = [${f(vy)} + √(${f(vy * vy)} + 2 × ${f(gU)} × (${f(y0)} − ${f(yL)}))] / ${f(gU)}<br>&nbsp;&nbsp;&nbsp;&nbsp;= [${f(vy)} + √${f(disc)}] / ${f(gU)} = [${f(vy)} + ${f(Math.sqrt(disc))}] / ${f(gU)} = <b>${f(tL, 3)} s</b>`]);
    const xL = vx * tL;
    steps.push(['Landing distance', `x_L = vₓ · t_L = ${f(vx)} × ${f(tL, 3)} = <b>${f(xL)} ${lu}</b>`]);
    if (!hiddenByMission()) {
      const zs = P.zoneBounds(zone());
      const a = U.lengthFromSI(zs.start, S.units), b = U.lengthFromSI(zs.end, S.units);
      const verdict = xL < a ? `${f(xL)} &lt; ${f(a)} → short` : xL > b ? `${f(xL)} &gt; ${f(b)} → overshoot` : `${f(a)} ≤ ${f(xL)} ≤ ${f(b)} → in the zone`;
      steps.push(['Check the landing zone', `Zone runs ${f(a)} to ${f(b)} ${lu}: ${verdict}`]);
    }
  }
  return `<div class="work">${steps.map(([w, mth]) => `<div class="stp"><div><div class="what">${w}</div><div class="math">${mth}</div></div></div>`).join('')}</div>
    <p style="margin:12px 0 0;font-size:12px;color:var(--muted)">Values update as you move the sliders. Rounded for display; the simulation keeps full precision.</p>`;
}

const TOGGLES = [['path', 'Predicted path'], ['grid', 'Grid'], ['vectors', 'Velocity vectors'], ['measure', 'Measurements'], ['annot', 'Equation labels']];
function renderToggles() {
  $('#toggles').innerHTML = TOGGLES.map(([k, l]) => `<button class="chip" data-tog="${k}" aria-pressed="${S.toggles[k]}"${k === 'path' && hiddenByMission() ? ' disabled title="Hidden for this mission"' : ''}>${l}</button>`).join('');
}
function renderHeader() {
  $('#tabExplore').setAttribute('aria-selected', S.mode === 'explore');
  $('#tabChallenge').setAttribute('aria-selected', S.mode === 'challenge');
  $('#uImp').setAttribute('aria-pressed', !met());
  $('#uMet').setAttribute('aria-pressed', met());
  $('#tutorBtn').setAttribute('aria-pressed', S.tutor);
  $('#lvlSimple').setAttribute('aria-pressed', S.level === 'simple');
  $('#lvlAdv').setAttribute('aria-pressed', S.level === 'advanced');
  $('#ctlTitle').textContent = S.mode === 'challenge' ? 'Mission Setup' : 'Jump Setup';
}
function refreshAll() {
  stopAnim();
  S.anim.t = 0;
  renderHeader();
  buildControls();
  renderToggles();
  renderScene();
  renderReadouts();
  renderActivity();
  renderWorkbench();
  renderTutor();
}
function setMode(mode) {
  if (mode === S.mode && !(mode === 'challenge' && !S.showList)) { if (mode === 'challenge') { S.showList = true; renderActivity(); } return; }
  if (mode === 'explore') {
    S.mode = 'explore';
    S.tutorLocks = {};
    S.ghosts = [];
    if (S.exploreVars) S.vars = { ...S.exploreVars };
    S.toggles.path = true;
    refreshAll();
  } else {
    if (S.mode === 'explore') S.exploreVars = { ...S.vars };
    if (S.mode !== 'challenge') loadChallenge(S.challengeId);
    S.showList = true;
    renderActivity();
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (t.id === 'tabExplore') return setMode('explore');
  if (t.id === 'tabChallenge' || d.goto === 'challenge') return setMode('challenge');
  if (t.id === 'uImp' || t.id === 'uMet') { S.units = t.id === 'uMet' ? 'metric' : 'imperial'; S.inputErr = {}; return refreshAll(); }
  if (t.id === 'tutorBtn') { S.tutor = !S.tutor; renderHeader(); renderTutor(); renderActivity(); return; }
  if (t.id === 'sessionBtn') return showSession();
  if (t.id === 'closeSess') { $('#modal').hidden = true; return $('#sessionBtn').focus(); }
  if (t.id === 'copySess') {
    const txt = sessionSummary().text, msg = $('#copyMsg');
    const fallback = () => { const ta = $('#sessText'); ta.focus(); ta.select(); msg.textContent = 'Selected. Press Ctrl/Cmd + C to copy.'; };
    try { navigator.clipboard.writeText(txt).then(() => (msg.textContent = 'Copied.'), fallback); } catch { fallback(); }
    return;
  }
  if (t.id === 'sendBtn') { hideOverlay(); return sendIt(); }
  if (t.id === 'playBtn') return S.anim.playing ? stopAnim() : play();
  if (t.id === 'resetBtn') { stopAnim(); S.anim.t = 0; S.flownKey = S.mode === 'explore' ? S.flownKey : null; hideOverlay(); renderScene(); renderReadouts(); return; }
  if (d.tog) { S.toggles[d.tog] = !S.toggles[d.tog]; renderToggles(); return renderScene(); }
  if (d.tab) { S.wbTab = d.tab; return renderWorkbench(); }
  if (t.id === 'lvlSimple' || t.id === 'lvlAdv') { S.level = t.id === 'lvlAdv' ? 'advanced' : 'simple'; renderHeader(); return renderWorkbench(); }
  if (t.id === 'wbToggle') { S.wbOpen = !S.wbOpen; $('#wbBody').hidden = !S.wbOpen; t.textContent = S.wbOpen ? 'Collapse' : 'Expand'; return t.setAttribute('aria-expanded', S.wbOpen); }
  if (t.id === 'defsBtn') { S.defs = !S.defs; return renderWorkbench(); }
  if (d.concept) { S.session.concepts.add(d.concept); const open = t.getAttribute('aria-expanded') === 'true'; t.setAttribute('aria-expanded', !open); return; }
  // explore
  if (t.id === 'predStart') { S.predict = { q: +$('#predSel').value, choice: null, done: false }; return renderActivity(); }
  if (d.pick != null) { S.predict.choice = +d.pick; return renderActivity(); }
  if (t.id === 'predReveal') return revealPrediction();
  if (t.id === 'predUndo') { S.vars = { ...S.predict.undo }; S.predict = null; syncControls(); onSetupChanged(); return renderActivity(); }
  if (t.id === 'predClose') { S.predict = null; return renderActivity(); }
  if (t.id === 'saveA' || t.id === 'saveB') { S.compare[t.id.slice(-1)] = snapshot(); renderScene(); return renderActivity(); }
  if (t.id === 'clearCmp') { S.compare = { A: null, B: null }; renderScene(); return renderActivity(); }
  // challenge
  if (t.id === 'toList') { S.showList = true; return renderActivity(); }
  if (d.diff) { S.diffFilter = d.diff; return renderActivity(); }
  if (d.ch) return loadChallenge(d.ch);
  if (d.cpred != null) { { const c = currentChallenge(), pr = c.prediction; trackChoice('mission-prediction', c.id, { prompt: pr.prompt, mission: c.title, explanation: pr.why }, pr.options, +d.cpred, pr.answer); }
    chState(S.challengeId).predicted = +d.cpred; S.session.predictions++; if (+d.cpred === currentChallenge().prediction.answer) S.session.correct++; return renderActivity(); }
  if (t.id === 'hintBtn' || d.thint != null) {
    const c = currentChallenge(), st = chState(c.id);
    const want = d.thint != null ? +d.thint + 1 : st.hints + 1;
    const added = Math.max(0, Math.min(want, c.hints.length) - st.hints);
    st.hints += added; S.session.hints += added;
    renderActivity(); return renderTutor();
  }
  if (t.id === 'solBtn' || t.id === 'tSol') { chState(S.challengeId).solution = true; renderActivity(); return renderTutor(); }
  if (t.id === 'ansLock') {
    const raw = $('#ansIn').value.trim(), x = Number(raw);
    if (raw === '' || !Number.isFinite(x) || x <= 0) { $('#ansErr').textContent = 'Enter a positive distance, like 21.5.'; return; }
    chState(S.challengeId).answer = U.lengthToSI(x, S.units);
    renderToggles(); renderScene(); renderReadouts(); renderActivity(); return renderWorkbench();
  }
  if (t.id === 'ansClear') { const st = chState(S.challengeId); st.answer = null; S.flownKey = null; renderToggles(); renderScene(); renderReadouts(); renderActivity(); return renderWorkbench(); }
  // tutor
  if (d.lock) { S.tutorLocks[d.lock] = !isLocked(d.lock); buildControls(); renderTutor(); return renderActivity(); }
  if (t.id === 'tEq') { S.eqHidden = !S.eqHidden; renderTutor(); return renderWorkbench(); }
  if (t.id === 'tBlind') { S.blind = !S.blind; S.revealed = !S.blind; renderTutor(); renderScene(); renderReadouts(); if (S.mode === 'explore') renderLiveFeedback(); return renderWorkbench(); }
  if (t.id === 'tReveal') { S.revealed = true; renderTutor(); renderScene(); renderReadouts(); if (S.mode === 'explore') renderLiveFeedback(); return renderWorkbench(); }
  if (t.id === 'tAsk') { S.discussQ = +$('#tQ').value; return showDiscussion(); }
  if (t.id === 'dReveal') { hideOverlay(); S.revealed = true; renderTutor(); return sendIt(); }
  if (t.id === 'dClose') return hideOverlay();
  if (t.id === 'tReset') { S.tutorLocks = {}; resetSetup(); return renderTutor(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'rate') S.anim.rate = +e.target.value;
  if (e.target.id === 'tActivity') { const v = e.target.value; if (v === 'explore') setMode('explore'); else { if (S.mode === 'explore') S.exploreVars = { ...S.vars }; loadChallenge(v); } }
  if (e.target.id === 'tQ') S.discussQ = +e.target.value;
});
$('#scrub').addEventListener('input', (e) => { stopAnim(); S.anim.t = (+e.target.value / 1000) * S.anim.endT; renderDynamic(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) { $('#modal').hidden = true; $('#sessionBtn').focus(); } else hideOverlay(); }
  if (e.key === 'Enter' && e.target.id === 'ansIn') $('#ansLock').click();
});

let lastSmall = null;
new ResizeObserver(() => { const sm = viewport().small; if (sm !== lastSmall) { lastSmall = sm; renderScene(); } }).observe($('.canvas-wrap'));

refreshAll();

return {  };
})();
</script>

</body>
</html>
